---
layout: default
title: La Maldekstra Kolono
---

{% include temas-filter.html %}

  <ul class="posts">
    {% for post in site.posts %}
    {% if post.type == "articulo" or post.type == "minor" %}
      <li data-temas="{{ post.temas | join: ' ' }}"><span>{% include fecha-corta.html date=post.date %}</span> &raquo; <a href="{{site.baseurl}}{{ post.url }}">{{ post.title }}</a></li>
    {% endif %}
    {% endfor %}
  </ul>
